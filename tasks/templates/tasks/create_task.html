{% extends "base.html" %}
{% block title %}Создать задачу{% endblock %}

{% block content %}
<h1>Новая задача на скачивание</h1>
<div class="card">
    <form method="post" class="task-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Отправить в Kafka</button>
    </form>
</div>
{% endblock %}
